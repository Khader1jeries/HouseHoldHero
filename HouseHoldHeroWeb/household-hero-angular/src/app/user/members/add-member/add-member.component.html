<div class="add-member-container">
  <div class="add-member-box">
    <h2>Add New Family Member</h2>
    <p class="subtitle">Create an account for your family member</p>

    <!-- Error message -->
    <div class="message error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Success message -->
    <div class="message success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <!-- First Name Input -->
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          placeholder="Enter first name"
          [(ngModel)]="newMember.firstName"
          name="firstName"
          required
        />
      </div>

      <!-- Last Name Input -->
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          placeholder="Enter last name"
          [(ngModel)]="newMember.lastName"
          name="lastName"
          required
        />
      </div>

      <!-- Email Input -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter email address"
          [(ngModel)]="newMember.email"
          name="email"
          required
        />
      </div>

      <!-- Phone Number Input -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <div class="phone-input">
          <select
            class="country-code"
            name="countryCode"
            [(ngModel)]="newMember.countryCode"
            required
          >
            <option value="+1">🇺🇸 +1 (USA)</option>
            <option value="+44">🇬🇧 +44 (UK)</option>
            <option value="+91">🇮🇳 +91 (India)</option>
            <option value="+33">🇫🇷 +33 (France)</option>
            <option value="+49">🇩🇪 +49 (Germany)</option>
            <option value="+972">🇮🇱 +972 (Israel)</option>
          </select>

          <input
            type="tel"
            id="phone"
            class="phone-number"
            placeholder="Enter phone number"
            [(ngModel)]="newMember.phoneNumber"
            name="phoneNumber"
            required
          />
        </div>
      </div>
      <!-- Date of Birth Input -->
      <div class="form-group">
        <label for="DOB">Date of Birth</label>
        <input
          type="date"
          id="DOB"
          placeholder="Date of birth"
          [(ngModel)]="newMember.DOB"
          name="DOB"
          required
        />
      </div>
      <!-- Password Input -->
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create password"
          [(ngModel)]="newMember.password"
          name="password"
          required
        />
      </div>

      <!-- Confirm Password Input -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
          [(ngModel)]="newMember.confirmPassword"
          name="confirmPassword"
          required
        />
      </div>

      <!-- Form Actions -->
      <div class="form-actions">
        <button type="button" class="cancel-btn" (click)="cancel()">
          Cancel
        </button>
        <button type="submit" class="submit-btn" [disabled]="isSubmitting">
          {{ isSubmitting ? "Adding..." : "Add Member" }}
        </button>
      </div>
    </form>
  </div>
</div>
