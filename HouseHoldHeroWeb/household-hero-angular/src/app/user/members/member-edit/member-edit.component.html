<div class="member-edit-container">
  <div class="back-button" (click)="cancel()">
    <i class="bi bi-arrow-left-circle"></i>
    <span>Back to Details</span>
  </div>

  <h2>Edit Member</h2>

  <!-- Status Messages -->
  <div class="status-message success" *ngIf="successMessage">
    <i class="bi bi-check-circle-fill"></i>
    <span>{{ successMessage }}</span>
  </div>
  <div class="status-message error" *ngIf="errorMessage">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>{{ errorMessage }}</span>
  </div>

  <div class="edit-form">
    <!-- Profile Picture Upload -->
    <div class="profile-picture-section">
      <img
        [src]="member.profileImage"
        alt="Profile Picture"
        class="profile-preview"
      />
      <div class="upload-controls">
        <label for="profile-pic-upload" class="upload-button">
          <i class="bi bi-camera-fill"></i>
          <span>Change Picture</span>
        </label>
        <input
          type="file"
          id="profile-pic-upload"
          accept="image/*"
          (change)="uploadProfilePicture($event)"
          style="display: none"
        />
      </div>
    </div>

    <!-- Member Information Form -->
    <div class="form-section">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="member.name"
          class="form-control"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="member.email"
          class="form-control"
          required
        />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          [(ngModel)]="member.phone"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="age">Age</label>
        <input
          type="number"
          id="age"
          name="age"
          [(ngModel)]="member.age"
          class="form-control"
          min="1"
          max="120"
        />
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <select
          id="role"
          name="role"
          [(ngModel)]="member.role"
          class="form-control"
        >
          <option *ngFor="let role of availableRoles" [value]="role">
            {{ role }}
          </option>
        </select>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <button type="button" class="cancel-btn" (click)="cancel()">
        Cancel
      </button>
      <button
        type="button"
        class="save-btn"
        (click)="saveMember()"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? "Saving..." : "Save Changes" }}
      </button>
    </div>
  </div>
</div>
