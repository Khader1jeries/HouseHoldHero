<div class="add-task-container">
  <div class="add-task-box">
    <h2>Create New Task</h2>
    <p class="subtitle">Add a new task for your family members</p>

    <!-- Error message -->
    <div class="message error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Success message -->
    <div class="message success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <!-- Task Title -->
      <div class="form-group">
        <label for="title">Task Title</label>
        <input
          type="text"
          id="title"
          placeholder="Enter task title"
          [(ngModel)]="newTask.title"
          name="title"
          required
        />
      </div>

      <!-- Task Description -->
      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          placeholder="Enter task description"
          [(ngModel)]="newTask.description"
          name="description"
          rows="4"
        ></textarea>
      </div>

      <!-- Due Date -->
      <div class="form-group">
        <label for="dueDate">Due Date</label>
        <input
          type="date"
          id="dueDate"
          [(ngModel)]="newTask.dueDate"
          name="dueDate"
          required
        />
      </div>

      <!-- Assignment Type -->
      <div class="form-group">
        <label>Assignment Type</label>
        <div class="radio-group">
          <div class="radio-option">
            <input
              type="radio"
              id="assignDirectly"
              name="assignmentType"
              value="direct"
              [(ngModel)]="assignmentType"
              checked
            />
            <label for="assignDirectly">Assign Directly</label>
          </div>
          <div class="radio-option">
            <input
              type="radio"
              id="createVoting"
              name="assignmentType"
              value="voting"
              [(ngModel)]="assignmentType"
            />
            <label for="createVoting">Create Voting</label>
          </div>
        </div>
      </div>

      <!-- Assigned To (shown only if "Assign Directly" is selected) -->
      <div class="form-group" *ngIf="assignmentType === 'direct'">
        <label for="assignedTo">Assign To</label>
        <select
          id="assignedTo"
          [(ngModel)]="newTask.assignedTo"
          name="assignedTo"
          required
        >
          <option value="">Select Family Member</option>
          <option *ngFor="let member of familyMembers" [value]="member.id">
            {{
              member.firstName ||
                (member.fullName ? member.fullName.split(" ")[0] : member.name)
            }}
          </option>
        </select>
      </div>

      <!-- Points -->
      <div class="form-group">
        <label for="points">Points</label>
        <input
          type="range"
          id="points"
          [(ngModel)]="newTask.points"
          name="points"
          min="10"
          max="100"
          step="5"
        />
        <div class="range-value">{{ newTask.points }} points</div>
      </div>

      <!-- Priority -->
      <div class="form-group">
        <label for="priority">Priority Level</label>
        <select
          id="priority"
          [(ngModel)]="newTask.priority"
          name="priority"
          class="form-control"
        >
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>

      <!-- Category -->
      <div class="form-group">
        <label for="category">Category</label>
        <select
          id="category"
          [(ngModel)]="newTask.category"
          name="category"
          class="form-control"
        >
          <option value="Cleaning">Cleaning</option>
          <option value="Cooking">Cooking</option>
          <option value="Outdoors">Outdoors</option>
          <option value="Shopping">Shopping</option>
          <option value="Maintenance">Maintenance</option>
          <option value="General">General</option>
        </select>
      </div>

      <!-- Sub-Tasks Section -->
      <div class="form-section">
        <h3>Sub-Tasks</h3>
        <div *ngIf="subTasks.length > 0" class="subtasks-list">
          <div
            *ngFor="let subTask of subTasks; let i = index"
            class="subtask-item"
          >
            <div class="subtask-info">
              <span>{{ subTask.title }}</span>
            </div>
            <button
              type="button"
              class="remove-subtask-btn"
              (click)="removeSubTask(i)"
            >
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>

        <div *ngIf="subTasks.length === 0" class="empty-subtasks">
          <p>No sub-tasks added yet. Add some below to break down this task.</p>
        </div>

        <div class="add-subtask">
          <div class="subtask-input-group">
            <input
              type="text"
              placeholder="Add a sub-task..."
              [(ngModel)]="newSubTaskTitle"
              name="newSubTaskTitle"
              class="form-control"
              (keyup.enter)="addSubTask()"
            />
            <button
              type="button"
              class="add-subtask-btn"
              (click)="addSubTask()"
            >
              <i class="bi bi-plus"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Form Actions -->
      <div class="form-actions">
        <button type="button" class="cancel-btn" (click)="cancel()">
          Cancel
        </button>
        <button type="submit" class="submit-btn" [disabled]="isSubmitting">
          {{ isSubmitting ? "Creating..." : "Create Task" }}
        </button>
      </div>
    </form>
  </div>
</div>
