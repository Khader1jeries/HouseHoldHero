<div class="edit-task-container">
  <div class="back-button" (click)="cancel()">
    <i class="bi bi-arrow-left-circle"></i>
    <span>Back to Task</span>
  </div>

  <h2>Edit Task</h2>

  <!-- Status Messages -->
  <div class="status-message success" *ngIf="successMessage">
    <i class="bi bi-check-circle-fill"></i>
    <span>{{ successMessage }}</span>
  </div>
  <div class="status-message error" *ngIf="errorMessage">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>{{ errorMessage }}</span>
  </div>

  <div class="edit-form">
    <!-- Task Information Form -->
    <div class="form-section">
      <h3>Task Information</h3>
      <div class="form-row">
        <div class="form-group">
          <label for="title">Task Title</label>
          <input
            type="text"
            id="title"
            name="title"
            [(ngModel)]="task.title"
            class="form-control"
            required
          />
        </div>

        <!-- <div class="form-group">
          <label for="category">Category</label>
          <select
            id="category"
            name="category"
            [(ngModel)]="task.category"
            class="form-control"
          >
            <option *ngFor="let category of categories" [value]="category">
              {{ category }}
            </option>
          </select>
        </div> -->
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          [(ngModel)]="task.description"
          class="form-control"
          rows="4"
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="assignedTo">Assign To</label>
          <select
            id="assignedTo"
            name="assignedTo"
            [(ngModel)]="task.assignedTo"
            class="form-control"
          >
            <option value="">Select Family Member</option>
            <option *ngFor="let member of familyMembers" [value]="member">
              {{ member }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="priority">Priority</label>
          <select
            id="priority"
            name="priority"
            [(ngModel)]="task.priority"
            class="form-control"
          >
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group" *ngIf="task.status === 'upcoming'">
          <label for="startDate">Start Date</label>
          <input
            type="date"
            id="startDate"
            name="startDate"
            [value]="startDateStr"
            (change)="onStartDateChange($event)"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="dueDate">Due Date</label>
          <input
            type="date"
            id="dueDate"
            name="dueDate"
            [value]="dueDateStr"
            (change)="onDueDateChange($event)"
            class="form-control"
            required
          />
        </div>

        <div class="form-group">
          <label for="points">Points</label>
          <input
            type="range"
            id="points"
            name="points"
            [(ngModel)]="task.score"
            min="10"
            max="100"
            step="5"
            class="range-input"
          />
          <div class="range-value">{{ task.score }} points</div>
        </div>
      </div>
    </div>

    <!-- Sub-Tasks Section -->
    <div class="form-section">
      <h3>Sub-Tasks</h3>
      <div
        class="subtasks-list"
        *ngIf="task.subTasks && task.subTasks.length > 0"
      >
        <div
          *ngFor="let subTask of task.subTasks; let i = index"
          class="subtask-item"
        >
          <div class="subtask-info">
            <div class="checkbox-wrapper">
              <input
                type="checkbox"
                [id]="'subtask-' + i"
                [checked]="subTask.completed"
                (change)="toggleSubTask(i)"
              />
              <label
                [for]="'subtask-' + i"
                [class.completed]="subTask.completed"
              >
                {{ subTask.title }}
              </label>
            </div>
          </div>
          <button
            type="button"
            class="remove-subtask-btn"
            (click)="removeSubTask(i)"
          >
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>

      <div
        class="empty-subtasks"
        *ngIf="!task.subTasks || task.subTasks.length === 0"
      >
        <p>No sub-tasks yet. Add some below!</p>
      </div>

      <div class="add-subtask">
        <div class="subtask-input-group">
          <input
            type="text"
            placeholder="Add a sub-task..."
            [(ngModel)]="newSubTaskTitle"
            name="newSubTaskTitle"
            class="form-control"
            (keyup.enter)="addSubTask()"
          />
          <button type="button" class="add-subtask-btn" (click)="addSubTask()">
            <i class="bi bi-plus"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <button type="button" class="cancel-btn" (click)="cancel()">
        Cancel
      </button>
      <button
        type="button"
        class="save-btn"
        (click)="saveTask()"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? "Saving..." : "Save Changes" }}
      </button>
    </div>
  </div>
</div>
