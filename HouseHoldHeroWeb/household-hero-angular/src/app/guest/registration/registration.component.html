<!-- Signup Container -->
<div class="signup-container">
  <div class="signup-box">
    <!-- Logo -->
    <div class="logo-container">
      <img src="assets/logo.png" alt="Household Hero Logo" class="logo" />
    </div>
    <div style="height: 5vh">
      <img
        src="assets/logo_name.png"
        alt="Household Hero Name"
        class="logo-name"
      />
    </div>

    <p class="subtitle">Sign up to continue</p>

    <form>
      <!-- Full Name Input -->
      <input type="text" placeholder="Enter your full name" required />

      <!-- Phone Number Input -->
      <div class="phone-input">
        <!-- Country Code Dropdown -->
        <select class="country-code" name="countryCode" required>
          <option value="+1">🇺🇸 +1 (USA)</option>
          <option value="+44">🇬🇧 +44 (UK)</option>
          <option value="+91">🇮🇳 +91 (India)</option>
          <option value="+33">🇫🇷 +33 (France)</option>
          <option value="+49">🇩🇪 +49 (Germany)</option>
          <option value="+972" selected>🇮🇱 +972 (Israel)</option>
          <!-- ✅ Default selection -->
        </select>

        <!-- Phone Number Input -->
        <input
          type="tel"
          name="phoneNumber"
          class="phone-number"
          placeholder="Enter phone number"
          required
        />
      </div>

      <!-- Email Input -->
      <input type="email" placeholder="Enter your email" required />

      <!-- Password Input -->
      <input type="password" placeholder="Enter your password" required />

      <!-- Confirm Password Input -->
      <input type="password" placeholder="Re-enter your password" required />

      <!-- Sign-Up Button -->
      <button type="submit" class="signup-btn">Sign up</button>
    </form>

    <!-- Login Link -->
    <p class="login-text">Already have an account? <a href="#">Log-in</a></p>
  </div>
</div>
