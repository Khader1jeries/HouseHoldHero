<div class="forgot-password-container">
    <div class="forgot-password-box">
      <!-- Logo -->
      <div class="logo-container">
        <img src="assets/logo.png" alt="Household Hero Logo" class="logo" />
      </div>
      <div>
        <img src="assets/logo_name.png" alt="Household Hero Name" class="logo-name" />
      </div>
  
      <h2>Forgot Password</h2>
      <p class="subtitle">Enter your email address to receive a verification code</p>
  
      <!-- Error message -->
      <div class="message error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
  
      <!-- Success message -->
      <div class="message success" *ngIf="successMessage">
        {{ successMessage }}
      </div>
  
      <form (ngSubmit)="onSubmit()" *ngIf="!successMessage">
        <input 
          type="email" 
          placeholder="Enter your email" 
          [(ngModel)]="email" 
          name="email"
          required 
        />
  
        <button type="submit" class="submit-btn" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Sending...' : 'Send Verification Code' }}
        </button>
      </form>
  
      <p class="back-link">
        <a routerLink="/guest/login">Back to Login</a>
      </p>
    </div>
  </div>
