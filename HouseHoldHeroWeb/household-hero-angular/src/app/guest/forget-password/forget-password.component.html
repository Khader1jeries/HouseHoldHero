<div class="forgot-password-container">
  <div class="forgot-password-box">
    <!-- Logo -->
    <div class="logo-container">
      <img src="assets/logo.png" alt="Household Hero Logo" class="logo" />
    </div>
    <div>
      <img
        src="assets/logo_name.png"
        alt="Household Hero Name"
        class="logo-name"
      />
    </div>

    <h2 *ngIf="currentStep === 'email'">Forgot Password</h2>
    <h2 *ngIf="currentStep === 'reset'">Reset Password</h2>

    <p class="subtitle" *ngIf="currentStep === 'email'">
      Enter your email address to reset your password
    </p>
    <p class="subtitle" *ngIf="currentStep === 'reset'">
      Create a new password for your account
    </p>

    <!-- Error message -->
    <div class="message error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Success message -->
    <div class="message success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <!-- Step 1: Email Verification -->
    <form *ngIf="currentStep === 'email'" (ngSubmit)="onCheckEmail()">
      <input
        type="email"
        placeholder="Enter your email address"
        [(ngModel)]="emailData.email"
        name="email"
        required
        [disabled]="isSubmitting"
      />

      <button type="submit" class="submit-btn" [disabled]="isSubmitting">
        {{ isSubmitting ? "Checking..." : "Continue" }}
      </button>
    </form>

    <!-- Step 2: Password Reset -->
    <form *ngIf="currentStep === 'reset'" (ngSubmit)="onResetPassword()">
      <input
        type="password"
        placeholder="Enter new password"
        [(ngModel)]="resetData.newPassword"
        name="newPassword"
        required
        [disabled]="isSubmitting"
      />

      <input
        type="password"
        placeholder="Confirm new password"
        [(ngModel)]="resetData.confirmPassword"
        name="confirmPassword"
        required
        [disabled]="isSubmitting"
      />

      <div style="display: flex; gap: 10px; margin-top: 1vh">
        <button
          type="button"
          (click)="goBackToEmail()"
          [disabled]="isSubmitting"
          class="submit-btn"
          style="background-color: #6c757d; flex: 1"
        >
          Back
        </button>
        <button
          type="submit"
          class="submit-btn"
          [disabled]="isSubmitting"
          style="flex: 2"
        >
          {{ isSubmitting ? "Resetting..." : "Reset Password" }}
        </button>
      </div>
    </form>

    <p class="back-link">
      <a routerLink="/guest/login">Back to Login</a>
    </p>
  </div>
</div>
