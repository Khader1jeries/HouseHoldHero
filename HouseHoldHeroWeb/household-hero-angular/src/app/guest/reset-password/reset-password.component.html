<div class="reset-password-container">
  <div class="reset-password-box">
    <!-- Logo -->
    <div class="logo-container">
      <img src="assets/logo.png" alt="Household Hero Logo" class="logo" />
    </div>
    <div>
      <img src="assets/logo_name.png" alt="Household Hero Name" class="logo-name" />
    </div>

    <h2>Reset Password</h2>
    <p class="subtitle">Set a new password for <strong>{{ email }}</strong></p>

    <!-- Error message -->
    <div class="message error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Success message -->
    <div class="message success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <input 
        type="password" 
        placeholder="New Password" 
        [(ngModel)]="newPassword" 
        name="newPassword"
        required 
      />

      <input 
        type="password" 
        placeholder="Confirm New Password" 
        [(ngModel)]="confirmPassword" 
        name="confirmPassword"
        required 
      />

      <button type="submit" class="submit-btn" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Processing...' : 'Reset Password' }}
      </button>
    </form>

    <p class="back-link">
      <a routerLink="/guest/login">Back to Login</a>
    </p>
  </div>
</div>
