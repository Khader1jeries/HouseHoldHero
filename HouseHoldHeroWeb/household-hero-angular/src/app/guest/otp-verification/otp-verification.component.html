<!-- src/app/guest/otp-verification/otp-verification.component.html -->
<div class="otp-container">
  <div class="otp-box">
    <!-- Logo -->
    <div class="logo-container">
      <img src="assets/logo.png" alt="Household Hero Logo" class="logo" />
    </div>
    <div>
      <img
        src="assets/logo_name.png"
        alt="Household Hero Name"
        class="logo-name"
      />
    </div>

    <h2>OTP VERIFICATION</h2>
    <p>
      Enter the verification code sent to <strong>{{ email }}</strong>
    </p>

    @if(errorMessage) {
    <div class="error-message">
      {{ errorMessage }}
    </div>
    }

    <form [formGroup]="otpForm" (ngSubmit)="onSubmit()">
      <!-- OTP Input Boxes -->
      <div class="otp-inputs">
        <input
          type="text"
          class="otp-input"
          maxlength="1"
          formControlName="digit1"
          inputmode="numeric"
        />
        <input
          type="text"
          class="otp-input"
          maxlength="1"
          formControlName="digit2"
          inputmode="numeric"
        />
        <input
          type="text"
          class="otp-input"
          maxlength="1"
          formControlName="digit3"
          inputmode="numeric"
        />
        <input
          type="text"
          class="otp-input"
          maxlength="1"
          formControlName="digit4"
          inputmode="numeric"
        />
      </div>

      <!-- Countdown Timer -->
      <p class="timer">{{ timerDisplay }} Sec</p>

      <!-- Resend OTP -->
      <p class="resend">
        Don't receive code?
        <a
          href="javascript:void(0)"
          (click)="resendOtp()"
          [class.disabled]="resendDisabled"
        >
          Re-send
        </a>
      </p>

      <!-- Submit Button -->
      <button
        type="submit"
        class="submit-btn"
        [disabled]="otpForm.invalid || loading"
      >
        {{ loading ? "Verifying..." : "Submit" }}
      </button>
    </form>
  </div>
</div>
