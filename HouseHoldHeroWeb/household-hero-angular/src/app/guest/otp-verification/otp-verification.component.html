<div class="otp-container">
  <div class="otp-box">
    <!-- Logo -->
    <div class="logo-container">
      <img src="assets/logo.png" alt="Household Hero Logo" class="logo" />
    </div>
    <div>
      <img
        src="assets/logo_name.png"
        alt="Household Hero Name"
        class="logo-name"
      />
    </div>

    <h2>OTP VERIFICATION</h2>
    <p>
      Enter the OTP sent to <strong>{{ email }}</strong>
    </p>

    <!-- Error message -->
    <div class="message error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- OTP Input Boxes -->
    <div class="otp-inputs">
      <input 
        type="text" 
        maxlength="1" 
        [(ngModel)]="otpDigits[0]" 
        (input)="onOtpDigitChange(0, $event)"
        #digit1
        autofocus
      />
      <input 
        type="text" 
        maxlength="1" 
        [(ngModel)]="otpDigits[1]" 
        (input)="onOtpDigitChange(1, $event)"
        #digit2
      />
      <input 
        type="text" 
        maxlength="1" 
        [(ngModel)]="otpDigits[2]" 
        (input)="onOtpDigitChange(2, $event)"
        #digit3
      />
      <input 
        type="text" 
        maxlength="1" 
        [(ngModel)]="otpDigits[3]" 
        (input)="onOtpDigitChange(3, $event)"
        #digit4
      />
    </div>

    <!-- Countdown Timer -->
    <p class="timer">{{ formatTime(remainingTime) }} seconds</p>

    <!-- Resend OTP -->
    <p class="resend">
      Don't receive code? 
      <a 
        href="javascript:void(0);" 
        [class.disabled]="!canResend" 
        (click)="resendOtp()"
      >
        Re-send
      </a>
    </p>

    <!-- Submit Button -->
    <button class="submit-btn" [disabled]="isVerifying" (click)="submitOtp()">
      {{ isVerifying ? 'Verifying...' : 'Submit' }}
    </button>
  </div>
</div>
