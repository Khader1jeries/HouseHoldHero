<!-- src/app/guest/login/login.component.html -->
<div class="login-container">
  <div class="login-box">
    <!-- Logo -->
    <a class="navbar-brand" href="#">
      <img src="assets/logo.png" class="logo" alt="Logo" />
    </a>

    <!-- Middle logo name -->
    <div class="navbar-middle">
      <img class="logo-name" src="assets/logo_name.png" alt="Logo Name" />
    </div>
    <p class="subtitle">Log in to continue</p>

    <!-- Error message display -->
    @if(errorMessage) {
    <div class="error-message">{{ errorMessage }}</div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <input
        type="email"
        formControlName="email"
        placeholder="Enter your email"
        required
      />

      <input
        type="password"
        formControlName="password"
        placeholder="Enter your password"
        required
      />

      <div class="remember-me">
        <input type="checkbox" id="remember" formControlName="rememberMe" />
        <label for="remember">Remember me</label>
      </div>

      <button
        type="submit"
        class="login-btn"
        [disabled]="loading || loginForm.invalid"
      >
        {{ loading ? "Logging in..." : "Login" }}
      </button>
    </form>

    <div class="links">
      <a href="javascript:void(0)" (click)="forgotPassword()"
        >Forgot Password?</a
      >
      <span>•</span>
      <a href="javascript:void(0)" (click)="navigateToRegistration()"
        >Create an account</a
      >
    </div>
  </div>
</div>
